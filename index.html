<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #120c1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Sacramento', cursive;
        }

        /* Title */
        h1 {
            color: #ffb6c1;
            font-size: 5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Canvas for Bouquet Container */
        .bouquet {
            position: relative;
            width: 300px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Ribbon Base */
        .ribbon {
            position: absolute;
            bottom: 30px;
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 130px solid #f7aef8;
            z-index: 10;
            opacity: 0;
            transform: scale(0);
            animation: popRibbon 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 4s;
            filter: drop-shadow(0 5px 15px rgba(247, 174, 248, 0.4));
        }

        @keyframes popRibbon {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Tulip Stems */
        .stem {
            position: absolute;
            width: 5px;
            height: 0;
            background: linear-gradient(to top, #2d6a4f, #52b788);
            border-radius: 5px;
            bottom: 60px;
            animation: growStem 1.2s ease forwards;
        }

        .s1 { left: 100px; transform: rotate(-18deg); animation-delay: 0.8s; }
        .s2 { left: 125px; transform: rotate(-8deg);  animation-delay: 1.1s; }
        .s3 { left: 150px; transform: rotate(0deg);   animation-delay: 1.4s; }
        .s4 { left: 175px; transform: rotate(8deg);   animation-delay: 1.7s; }
        .s5 { left: 200px; transform: rotate(18deg);  animation-delay: 2.0s; }

        @keyframes growStem {
            to { height: 210px; }
        }

        /* Tulip Heads */
        .tulip {
            position: absolute;
            width: 44px;
            height: 60px;
            background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
            border-radius: 0 0 22px 22px;
            opacity: 0;
            transform: scale(0);
            animation: bloomTulip 0.8s ease forwards;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
        }

        .tulip::before, .tulip::after {
            content: '';
            position: absolute;
            top: 0;
            width: 22px;
            height: 45px;
            background: #ff758f;
            border-radius: 22px 22px 0 0;
        }

        .tulip::before { left: 0; transform: rotate(-10deg); }
        .tulip::after { right: 0; transform: rotate(10deg); background: #c9184a; }

        .t1 { top: 110px; left: 65px;  animation-delay: 2.2s; }
        .t2 { top: 80px;  left: 105px; animation-delay: 2.5s; }
        .t3 { top: 60px;  left: 150px; transform: translateX(-50%); animation-delay: 2.8s; }
        .t4 { top: 80px;  left: 185px; animation-delay: 3.1s; }
        .t5 { top: 110px; left: 225px; animation-delay: 3.4s; }

        @keyframes bloomTulip {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <h1>For You ♡</h1>

    <div class="bouquet">
        <!-- Stems -->
        <div class="stem s1"></div>
        <div class="stem s2"></div>
        <div class="stem s3"></div>
        <div class="stem s4"></div>
        <div class="stem s5"></div>

        <!-- Tulips -->
        <div class="tulip t1"></div>
        <div class="tulip t2"></div>
        <div class="tulip t3"></div>
        <div class="tulip t4"></div>
        <div class="tulip t5"></div>

        <!-- Ribbon Wrap -->
        <div class="ribbon"></div>
    </div>

</body>
</html>
