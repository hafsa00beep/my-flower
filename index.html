<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #2b111e 0%, #0f0a12 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Great Vibes', cursive;
        }

        /* Title */
        h1 {
            color: #ffb3c1;
            font-size: 4.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 179, 193, 0.8), 0 0 40px rgba(255, 77, 109, 0.4);
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInTitle 2s ease-in-out forwards;
            animation-delay: 0.5s;
            text-align: center;
        }

        @keyframes fadeInTitle {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bouquet Container */
        .bouquet-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* HD Bouquet Image Animation */
        .bouquet-img {
            width: 320px;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
            opacity: 0;
            transform: scale(0.6) translateY(50px);
            animation: bloomEffect 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 1.2s;
        }

        @keyframes bloomEffect {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Sparkles / Glow background */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 143, 163, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <h1>For You ♡</h1>

    <div class="bouquet-container">
        <div class="glow"></div>
        <!-- صورة بوكيه ورد طبيعي واحترافي بدقة عالية -->
        <img class="bouquet-img" src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?q=80&w=600&auto=format&fit=crop" alt="Pink Rose Bouquet">
    </div>

</body>
</html>
